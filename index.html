<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HostMe · Event tickets in Kenya</title>
    <meta
      name="description"
      content="Discover events in Kenya and buy tickets with M-Pesa. No account needed."
    />
    <meta property="og:title" content="HostMe" />
    <meta
      property="og:description"
      content="Discover events in Kenya and buy tickets with M-Pesa."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
    />
    <script>
      // Apply the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("hostme.theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
